<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Rakan Runner</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111;color:white;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
  h1{margin:12px 0 6px;font-size:28px}
  #wrap{position:relative;width:100%;max-width:600px;margin:auto}
  canvas{display:block;width:100%;height:auto;border:3px solid white;border-radius:10px;background:#87ceeb;touch-action:none}
  #restart{
    display:none;position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);
    border:0;border-radius:12px;padding:13px 24px;font-size:19px;font-weight:bold;
    background:#ffcc00;color:#111;box-shadow:0 4px 0 #9a7800
  }
  #hint{font-size:14px;color:#ccc;margin:8px}
</style>
</head>
<body>
<h1>🏃 Rakan Runner</h1>
<div id="wrap">
<canvas id="game" width="600" height="340"></canvas>
<button id="restart">🔄 RESTART</button>
</div>
<div id="hint">Tap the game to jump • Collect 🟡 coins • Avoid obstacles</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const restartBtn=document.getElementById("restart");

let player, obstacle, coins, score, coinCount, speed, gameOver, highScore;
let stars=[];

try{highScore=Number(localStorage.getItem("rakanHighScore")||0)}catch(e){highScore=0}

for(let i=0;i<45;i++){
  stars.push({x:Math.random()*600,y:Math.random()*190,r:Math.random()*2+0.5});
}

function resetGame(){
  player={x:80,y:245,w:34,h:48,vy:0,onGround:true,run:0};
  obstacle={x:650,y:265,w:34,h:45};
  coins=[];
  score=0;
  coinCount=0;
  speed=6;
  gameOver=false;
  restartBtn.style.display="none";
}
resetGame();

function jump(){
  if(gameOver)return;
  if(player.onGround){
    player.vy=-13;
    player.onGround=false;
  }
}

canvas.addEventListener("touchstart",e=>{e.preventDefault();jump()},{passive:false});
canvas.addEventListener("mousedown",jump);
restartBtn.addEventListener("click",resetGame);

function spawnCoin(){
  coins.push({
    x:650+Math.random()*180,
    y:175+Math.random()*65,
    r:10
  });
}

function hit(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x &&
         a.y < b.y+b.h && a.y+a.h > b.y;
}

function drawBackground(){
  let g=ctx.createLinearGradient(0,0,0,340);
  g.addColorStop(0,"#55b9e8");
  g.addColorStop(1,"#d8f4ff");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,600,340);

  // clouds
  ctx.fillStyle="rgba(255,255,255,.8)";
  for(const c of [{x:100,y:65},{x:400,y:95},{x:520,y:45}]){
    ctx.beginPath();ctx.arc(c.x,c.y,22,0,Math.PI*2);
    ctx.arc(c.x+25,c.y+5,16,0,Math.PI*2);
    ctx.arc(c.x-22,c.y+8,15,0,Math.PI*2);ctx.fill();
  }

  // ground
  ctx.fillStyle="#48a93d";ctx.fillRect(0,293,600,47);
  ctx.fillStyle="#267b27";ctx.fillRect(0,293,600,6);

  // little ground marks
  ctx.fillStyle="#8bd85a";
  for(let x=0;x<600;x+=45)ctx.fillRect((x-(score*speed)%45),315,20,3);
}

function drawPlayer(){
  const bob=player.onGround?Math.sin(player.run)*2:0;
  const x=player.x,y=player.y+bob;

  // shadow
  ctx.fillStyle="rgba(0,0,0,.2)";
  ctx.beginPath();ctx.ellipse(x+17,295,22,5,0,0,Math.PI*2);ctx.fill();

  // legs
  ctx.strokeStyle="#222";ctx.lineWidth=7;ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(x+12,y+36);ctx.lineTo(x+7,y+48);
  ctx.moveTo(x+23,y+36);ctx.lineTo(x+29,y+48);ctx.stroke();

  // shoes
  ctx.fillStyle="#111";
  ctx.fillRect(x+1,y+45,12,5);ctx.fillRect(x+26,y+45,12,5);

  // body/shirt
  ctx.fillStyle="#e53935";
  ctx.fillRect(x+5,y+18,25,23);

  // arms
  ctx.strokeStyle="#f2b27b";ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(x+6,y+22);ctx.lineTo(x-3,y+32);
  ctx.moveTo(x+29,y+22);ctx.lineTo(x+38,y+14);ctx.stroke();

  // head
  ctx.fillStyle="#f2b27b";ctx.beginPath();ctx.arc(x+18,y+10,13,0,Math.PI*2);ctx.fill();

  // hair
  ctx.fillStyle="#222";ctx.beginPath();
  ctx.arc(x+18,y+6,13,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillRect(x+6,y+6,5,8);

  // eye
  ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x+23,y+9,2,0,Math.PI*2);ctx.fill();
}

function drawObstacle(){
  ctx.fillStyle="#333";
  ctx.fillRect(obstacle.x,obstacle.y,obstacle.w,obstacle.h);
  ctx.fillStyle="#555";
  ctx.fillRect(obstacle.x+6,obstacle.y+6,7,obstacle.h-6);
  ctx.fillStyle="#111";
  ctx.fillRect(obstacle.x-4,obstacle.y+obstacle.h-5,obstacle.w+8,5);
}

function drawCoin(c){
  ctx.fillStyle="#ffd21a";
  ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#e09d00";ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle="#fff4a3";ctx.font="bold 13px Arial";ctx.fillText("$",c.x-4,c.y+5);
}

function drawHUD(){
  ctx.fillStyle="#111";ctx.font="bold 18px Arial";
  ctx.fillText("⭐ "+score,18,28);
  ctx.fillText("🟡 "+coinCount,120,28);
  ctx.fillText("🏆 "+highScore,235,28);
}

function endGame(){
  gameOver=true;
  if(score>highScore){
    highScore=score;
    try{localStorage.setItem("rakanHighScore",highScore)}catch(e){}
  }
  restartBtn.style.display="block";
}

let lastCoin=0;

function loop(){
  drawBackground();

  if(!gameOver){
    score++;
    speed=Math.min(12,6+score/250);
    player.run+=0.25;

    player.vy+=0.65;
    player.y+=player.vy;
    if(player.y>=245){player.y=245;player.vy=0;player.onGround=true}

    obstacle.x-=speed;
    if(obstacle.x<-50){
      obstacle.x=650+Math.random()*120;
      obstacle.h=35+Math.random()*30;
      obstacle.y=293-obstacle.h;
    }

    if(score-lastCoin>75+Math.random()*45){
      spawnCoin();
      lastCoin=score;
    }

    for(let i=coins.length-1;i>=0;i--){
      coins[i].x-=speed;
      if(Math.abs((player.x+player.w/2)-coins[i].x)<25 &&
         Math.abs((player.y+player.h/2)-coins[i].y)<30){
        coinCount++;
        coins.splice(i,1);
      }else if(coins[i].x<-30) coins.splice(i,1);
    }

    if(hit(player,obstacle))endGame();
  }

  for(const c of coins)drawCoin(c);
  drawObstacle();
  drawPlayer();
  drawHUD();

  if(gameOver){
    ctx.fillStyle="rgba(0,0,0,.58)";
    ctx.fillRect(0,0,600,340);
    ctx.fillStyle="#fff";ctx.textAlign="center";
    ctx.font="bold 48px Arial";ctx.fillText("GAME OVER",300,145);
    ctx.font="22px Arial";ctx.fillText("Score: "+score+"   Coins: "+coinCount,300,185);
    ctx.font="17px Arial";ctx.fillText("Tap RESTART to play again",300,215);
    ctx.textAlign="left";
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
